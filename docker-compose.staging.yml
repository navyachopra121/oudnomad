services:
  app:
    image: ghcr.io/${GITHUB_REPOSITORY:-your-org/oudnomad}/api:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: staging
      LOG_LEVEL: debug

  web:
    image: ghcr.io/${GITHUB_REPOSITORY:-your-org/oudnomad}/web:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: staging

  notification-worker:
    image: ghcr.io/${GITHUB_REPOSITORY:-your-org/oudnomad}/notification-worker:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: staging
