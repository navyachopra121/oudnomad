packages:
  - 'apps/*'
  - 'packages/*'

# Build scripts approved via `pnpm approve-builds --all`.
# These packages need to run their postinstall/install scripts (Prisma engines, native modules).
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true
