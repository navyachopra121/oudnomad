name: Deploy Production (Manual)

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Git commit SHA to deploy (defaults to latest main)'
        required: false
        default: ''

jobs:
  deploy:
    name: Deploy to oudnomaddubai.com
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://oudnomaddubai.com

    steps:
      - name: Deploy to Hostinger VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /var/www/oudnomad

            echo "📦 Pulling latest main..."
            git fetch origin main
            git checkout main
            git pull origin main

            echo "🔧 Installing dependencies..."
            pnpm install --filter api --filter notification-worker --filter web --frozen-lockfile

            echo "🔨 Building all apps..."
            pnpm --filter api build
            pnpm --filter notification-worker build
            pnpm --filter web build

            echo "🗄️  Running database migrations..."
            pnpm --filter api exec prisma migrate deploy

            echo "🔄 Restarting services via PM2..."
            pm2 restart ecosystem.config.cjs --update-env
            pm2 save

            echo "🏥 Health check..."
            sleep 5
            curl -sf https://oudnomaddubai.com/api/health || \
              (echo "❌ Health check failed!" && exit 1)

            echo "✅ Manual production deploy complete!"
