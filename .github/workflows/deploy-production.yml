name: Deploy Production (Manual)

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Git commit SHA to deploy (defaults to latest main)'
        required: false
        default: ''

jobs:
  deploy:
    name: Deploy to oudnomaddubai.com
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://oudnomaddubai.com

    steps:
      - name: Deploy to Hostinger VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /var/www/oudnomad

            echo "📦 Pulling latest compose & config files..."
            git fetch origin main
            git checkout main
            git pull origin main

            echo "🔑 Authenticating with GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "🛑 Stopping PM2 legacy processes if active..."
            if command -v pm2 >/dev/null 2>&1; then
              pm2 stop ecosystem.config.cjs 2>/dev/null || true
              pm2 delete ecosystem.config.cjs 2>/dev/null || true
              pm2 save 2>/dev/null || true
            fi

            TAG="${{ github.event.inputs.sha }}"
            if [ -z "$TAG" ]; then
              TAG="latest"
            fi
            echo "📥 Pulling Docker containers for tag: $TAG..."

            REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
            export GITHUB_REPOSITORY="$REPO_LOWER"
            export IMAGE_TAG="$TAG"

            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull app web notification-worker

            echo "🚀 Launching production containers..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps --remove-orphans app web notification-worker

            echo "🗄️ Running database migrations inside container..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T app npx prisma migrate deploy

            echo "🧹 Cleaning old Docker layers to protect VPS disk space..."
            docker image prune -f

            echo "🏥 Health check..."
            sleep 5
            curl -sf https://oudnomaddubai.com/api/health || \
              (echo "❌ Health check failed!" && exit 1)

            echo "✅ Manual production Docker deploy complete!"
