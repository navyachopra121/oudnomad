name: Deploy to Staging (dev branch)

on:
  push:
    branches: [dev]

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    # Only runs if you have STAGING_HOST secret set;
    # if not configured, this job simply skips
    if: vars.STAGING_ENABLED == 'true'
    environment:
      name: staging

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Staging VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /var/www/oudnomad

            git pull origin dev

            pnpm install --filter api --filter notification-worker --filter web --frozen-lockfile
            pnpm --filter api build
            pnpm --filter notification-worker build
            pnpm --filter web build
            pnpm --filter api exec prisma migrate deploy

            pm2 restart ecosystem.config.cjs --update-env
            pm2 save

            sleep 5
            curl -sf http://localhost:3001/api/health || exit 1
            echo "✅ Staging deploy complete"
