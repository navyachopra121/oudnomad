name: Deploy to Staging (dev branch)

on:
  push:
    branches: [dev]

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    # Only runs if you have STAGING_HOST secret set;
    # if not configured, this job simply skips
    if: vars.STAGING_ENABLED == 'true'
    environment:
      name: staging

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Staging VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /var/www/oudnomad

            echo "📦 Pulling latest compose & config files..."
            git pull origin dev

            echo "🔑 Authenticating with GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "🛑 Stopping PM2 legacy processes if active..."
            if command -v pm2 >/dev/null 2>&1; then
              pm2 stop ecosystem.config.cjs 2>/dev/null || true
              pm2 delete ecosystem.config.cjs 2>/dev/null || true
              pm2 save 2>/dev/null || true
            fi

            echo "📥 Pulling staging Docker containers..."
            REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
            export GITHUB_REPOSITORY="$REPO_LOWER"
            export IMAGE_TAG="${{ github.sha }}"

            docker compose -f docker-compose.yml -f docker-compose.staging.yml pull app web notification-worker

            echo "🚀 Launching staging containers..."
            docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --no-deps --remove-orphans app web notification-worker

            echo "🗄️ Running database migrations inside container..."
            docker compose -f docker-compose.yml -f docker-compose.staging.yml exec -T app npx prisma migrate deploy 2>/dev/null || docker compose -f docker-compose.yml -f docker-compose.staging.yml exec -T app npx prisma db push --skip-generate

            echo "🧹 Cleaning old Docker layers to protect VPS disk space..."
            docker image prune -f

            sleep 5
            curl -sf http://localhost:3001/api/health || exit 1
            echo "✅ Staging Docker deploy complete"
