name: CI — Lint, Test & Build Images

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # ─── 1. Lint & Type-check ───────────────────────────────────────────────────
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  # ─── 2. Unit Tests ──────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter api db:generate
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/test

      - name: Run Prisma Migrations
        run: pnpm --filter api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/test

      - name: Run Unit Tests
        run: pnpm --filter api test
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/test
          NODE_ENV: test

  # ─── 3. Build & Push Docker Images ──────────────────────────────────────────
  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    # Only push images from main or dev branch (not PRs)
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── API Image ──────────────────────────────────────────────────────────
      - name: Build & Push API Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
            ghcr.io/${{ github.repository }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # ── Web Image ──────────────────────────────────────────────────────────
      - name: Build & Push Web Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web:${{ github.sha }}
            ghcr.io/${{ github.repository }}/web:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://oudnomaddubai.com/api
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # ── Notification Worker Image ──────────────────────────────────────────
      - name: Build & Push Notification Worker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/notification-worker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/notification-worker:${{ github.sha }}
            ghcr.io/${{ github.repository }}/notification-worker:latest
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  # ─── 4. Auto-Deploy to Production (main only) ────────────────────────────
  deploy-production:
    name: Auto-Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://oudnomaddubai.com

    steps:
      - name: Deploy to Hostinger VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /var/www/oudnomad

            echo "📦 Pulling latest code..."
            git pull origin main

            echo "🔧 Installing dependencies..."
            pnpm install --filter api --filter notification-worker --filter web --frozen-lockfile

            echo "🔨 Building apps..."
            pnpm --filter api build
            pnpm --filter notification-worker build
            pnpm --filter web build

            echo "🗄️  Running database migrations..."
            pnpm --filter api exec prisma migrate deploy

            echo "🔄 Restarting services..."
            pm2 restart ecosystem.config.cjs --update-env
            pm2 save

            echo "🏥 Health check..."
            sleep 5
            curl -sf https://oudnomaddubai.com/api/health || \
              (echo "❌ Health check failed!" && exit 1)

            echo "✅ Production deploy complete: https://oudnomaddubai.com"
